<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALKP Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style id="app-css">
/* Soft Neo-Brutalism: border 2px solid, hard shadow tanpa blur, radius 14-16px */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg-page:#F8FAFC;--bg-surface:#FFFFFF;--bg-hero:#DBEAFE;
--accent-primary:#2563EB;--accent-secondary:#10B981;--accent-success:#4ADE80;
--text-primary:#0F172A;--text-secondary:#475569;--border-color:#0F172A;--shadow-color:#0F172A;
--blue:#2563EB;
--green-soft:#D1FAE5;--green-ink:#047857;--blue-soft:#DBEAFE;
--accent-ink:#FFFFFF;--warn:#C2410C;--urgent:#FDBA74;--sky:#0EA5E9;--overlay:rgba(15,23,42,.6);
--line:color-mix(in srgb,var(--border-color) 30%,transparent);
--r:16px;--r-sm:12px;
--heading:'Space Grotesk','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
/* alias untuk kode lama (radar, dll) */
--bg:var(--bg-page);--surface:var(--bg-surface);--ink:var(--text-primary);--muted:var(--text-secondary);--accent:var(--accent-primary);--tag:var(--bg-page)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg-page:#0B132B;--bg-surface:#131F3D;--bg-hero:#1B2A4E;
--accent-primary:#38BDF8;--accent-secondary:#34D399;--accent-success:#4ADE80;
--text-primary:#F8FAFC;--text-secondary:#94A3B8;--border-color:#38BDF8;--shadow-color:#040814;
--blue:#38BDF8;
--green-soft:#0F3D3A;--green-ink:#34D399;--blue-soft:#1B2A4E;
--accent-ink:#0B132B;--warn:#FB923C;--sky:#38BDF8;--overlay:rgba(4,8,20,.75);color-scheme:dark}}
:root[data-theme="dark"],:root.dark{
--bg-page:#0B132B;--bg-surface:#131F3D;--bg-hero:#1B2A4E;
--accent-primary:#38BDF8;--accent-secondary:#34D399;--accent-success:#4ADE80;
--text-primary:#F8FAFC;--text-secondary:#94A3B8;--border-color:#38BDF8;--shadow-color:#040814;
--blue:#38BDF8;
--green-soft:#0F3D3A;--green-ink:#34D399;--blue-soft:#1B2A4E;
--accent-ink:#0B132B;--warn:#FB923C;--sky:#38BDF8;--overlay:rgba(4,8,20,.75);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font:500 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg-page);z-index:20}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-primary);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--heading);font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:0;text-wrap:balance}
section{padding:44px 0 0}

/* tombol: border tegas + hard shadow + efek terangkat/tertekan */
.btn,.cta,.pb2,.sb,.ab,.tg,.x,.sh a,.sh button{border:2px solid var(--border-color);box-shadow:3px 3px 0 var(--shadow-color);transition:all .15s ease;cursor:pointer}
.btn:hover,.cta:hover,.pb2:hover,.ab:hover,.tg:hover,.x:hover,.sh a:hover,.sh button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow-color)}
.btn:active,.cta:active,.pb2:active,.sb:active,.ab:active,.tg:active,.x:active,.sh a:active,.sh button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-color)}
.sb{box-shadow:2px 2px 0 var(--shadow-color)}
.sb:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--shadow-color)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-page);border-bottom:2px solid var(--border-color)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:66px;gap:24px}
.logo{display:inline-flex;align-items:center;gap:9px;margin-right:auto;font:800 22px var(--heading);text-decoration:none;letter-spacing:-.02em}
.logo .lt{color:var(--text-primary)}
.logo em{font-style:normal;color:var(--accent-primary)}
.lm{color:var(--text-primary);flex:none}
nav{display:flex;gap:8px;align-items:center}
nav a{text-decoration:none;padding:8px 16px;border:2px solid transparent;border-radius:999px;font:700 14.5px var(--heading);color:var(--text-secondary);transition:all .15s ease}
nav a:hover{color:var(--text-primary);border-color:var(--border-color);background:var(--bg-surface)}
nav a.on{background:var(--accent-primary);color:var(--accent-ink);border-color:var(--border-color);box-shadow:2px 2px 0 var(--shadow-color)}
.acts{display:flex;align-items:center;gap:12px;padding-left:20px;border-left:2px dashed var(--line)}
.tg{width:40px;height:40px;background:var(--bg-surface);border-radius:50%;display:grid;place-items:center;flex:none}
.tg .i-sun{display:none}
:root[data-theme="dark"] .tg .i-sun,:root.dark .tg .i-sun{display:block}
:root[data-theme="dark"] .tg .i-moon,:root.dark .tg .i-moon{display:none}
.ab{height:40px;padding:0 16px;background:var(--bg-surface);border-radius:12px;font-weight:700;font-size:14px;flex:none}
.abar{background:var(--text-primary);color:var(--bg-page)}
.abi{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px;font-size:14px}
.abi span{margin-right:auto;font-weight:700}
.abar .sb{background:var(--bg-surface);color:var(--text-primary)}

/* hero */
.intro{position:relative;overflow:hidden;margin-top:24px;padding:clamp(32px,6vw,60px) clamp(20px,5vw,56px);background:var(--bg-hero);color:var(--text-primary);border:2px solid var(--border-color);border-radius:var(--r);box-shadow:5px 5px 0 var(--shadow-color)}
.intro::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--border-color) 1px,transparent 1px);background-size:20px 20px;opacity:.18;pointer-events:none}
.intro>*{position:relative;z-index:1}
.intro h1{font-size:clamp(34px,5.4vw,54px);letter-spacing:-.03em;max-width:17ch}
.intro p{color:var(--text-secondary);font-size:18px;max-width:56ch;margin:18px 0 28px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:40px;align-items:center}
.sform{display:flex;max-width:620px;gap:6px;padding:6px;background:var(--bg-surface);border:2px solid var(--border-color);border-radius:var(--r);box-shadow:5px 5px 0 var(--shadow-color)}
.sform input{flex:1;min-width:0;border:0;background:transparent;padding:12px 14px;font-size:16px;color:var(--text-primary)}
.sform input:focus-visible{outline:none}
.sform:focus-within{outline:3px solid var(--accent-primary);outline-offset:3px}
.sform input::placeholder{color:var(--text-secondary);opacity:.8}
.btn{background:var(--accent-primary);color:var(--accent-ink);padding:0 22px;font-weight:700;border-radius:var(--r-sm)}
.sform .btn{box-shadow:none;border-radius:10px}
.sform .btn:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--shadow-color)}
.sform .btn:active{transform:translate(1px,1px);box-shadow:none}
.quick{margin-top:20px;font-size:14.5px;color:var(--text-secondary);display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600}
.quick button{background:none;border:0;padding:0;color:var(--text-primary);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer}
.radar{width:100%;max-width:340px;height:auto;display:block;justify-self:center;color:var(--text-primary)}
.r-ring{fill:none;stroke:var(--text-primary);stroke-opacity:.35;stroke-width:1.5}
.r-ax{stroke:var(--text-primary);stroke-opacity:.3;stroke-width:1.5}
.r-wedge{fill:var(--accent-primary);opacity:.22}
.r-lead{stroke:var(--accent-primary);stroke-width:3;stroke-linecap:round}
.sweep{transform-origin:200px 200px;animation:spin 8s linear infinite}
.blip{animation:pulse 2.6s ease-in-out infinite}
.r-txt{font:700 13px var(--body);fill:var(--text-primary)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sweep,.blip{animation:none}*{transition:none!important}}

/* statistik: pill terpisah */
.facts{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.facts span{display:inline-flex;align-items:baseline;gap:8px;padding:8px 18px;background:var(--bg-surface);color:var(--text-secondary);border:2px solid var(--border-color);border-radius:999px;box-shadow:3px 3px 0 var(--shadow-color);font-size:14.5px;font-weight:600}
.facts b{font:800 24px var(--heading);color:var(--text-primary)}
.facts span:nth-child(1) b{color:var(--accent-primary)}

/* judul section */
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;border-bottom:2px solid var(--border-color);padding-bottom:12px}
.sh h2{font-size:26px}
.sh a,.sh button{display:inline-block;background:var(--bg-surface);color:var(--text-primary);font-weight:700;font-size:14px;text-decoration:none;padding:6px 14px;border-radius:999px}

/* kartu lomba */
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:24px}
.list li{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-direction:column;flex:1;width:100%;padding:0;overflow:hidden;text-align:left;background:var(--bg-surface);color:var(--text-primary);border:2px solid var(--border-color);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow-color);cursor:pointer;transition:all .15s ease}
.row:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow-color)}
.bn{position:relative;height:96px;flex:none;display:grid;place-items:center;background:var(--bn,#BAE6FD);border-bottom:2px solid var(--border-color);overflow:hidden}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bn svg{width:46px;height:46px;fill:none;stroke:#18181B;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.b-hot{position:absolute;top:10px;left:10px;background:#FACC15;color:#18181B;border:1.5px solid #18181B;font:700 12px/1 var(--body);padding:5px 10px;border-radius:999px}
.cb{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px;flex:1}
.kicker{font:700 12px var(--heading);letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.t{font:800 19px/1.2 var(--heading);margin:0}
.s{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0;color:var(--text-secondary);font-size:14.5px}
.m{margin:0;font-size:13.5px;color:var(--text-secondary)}
.cf{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:2px dashed var(--border-color)}
.pill{font:700 12.5px/1 var(--body);padding:6px 10px;border-radius:999px;background:var(--accent-success);color:#18181B;border:1.5px solid var(--border-color)}
.pill.p-u{background:var(--urgent);color:#18181B}
.pill.p-c{background:var(--bg-page);color:var(--text-secondary);text-decoration:line-through}
.cf .fee{font:700 13.5px var(--body);color:var(--text-primary)}
.ra{display:flex;gap:8px}
.ra2{display:flex;gap:8px;margin-top:24px;border-top:2px dashed var(--border-color);padding-top:16px}

/* filter & pencarian */
.filters{display:flex;flex-wrap:wrap;gap:14px;padding:32px 0 22px}
.filters input,.filters select,.fi{border:2px solid var(--border-color);background:var(--bg-surface);color:var(--text-primary);padding:10px 12px;border-radius:var(--r-sm);min-width:0;font-weight:500}
.filters input{flex:1 1 260px;box-shadow:5px 5px 0 var(--shadow-color)}
.filters select{box-shadow:3px 3px 0 var(--shadow-color)}
.seg{display:flex;gap:4px;padding:4px;border:2px solid var(--border-color);border-radius:var(--r-sm);background:var(--bg-surface);box-shadow:3px 3px 0 var(--shadow-color)}
.seg button{border:0;background:none;padding:6px 16px;cursor:pointer;font-weight:700;font-size:15px;border-radius:8px}
.seg button.on{background:var(--accent-primary);color:var(--accent-ink)}
.count{color:var(--text-secondary);font-weight:700;font-size:14.5px;margin:0 0 16px}
.empty{padding:48px 16px;color:var(--text-secondary);text-align:center;border:2px dashed var(--border-color);border-radius:var(--r)}

/* footer */
footer{margin-top:72px;background:var(--bg-hero);color:var(--text-primary);border-top:2px solid var(--border-color);padding:24px 0 28px;font-size:14px;font-weight:600}

/* dialog */
.ov{position:fixed;inset:0;z-index:50;background:var(--overlay);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.dlg{position:relative;max-width:680px;margin:24px auto;background:var(--bg-surface);border:2px solid var(--border-color);border-radius:var(--r);box-shadow:6px 6px 0 var(--shadow-color);padding:32px clamp(20px,4vw,36px)}
.dlg h2{font-size:clamp(26px,4vw,34px);margin:4px 0 12px;padding-right:40px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--bg-surface);font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.k{font:700 13px var(--heading);letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:3px}
.dlg .s{display:block;-webkit-line-clamp:unset;font-size:16px;max-width:62ch}
dl{display:grid;grid-template-columns:130px minmax(0,1fr);margin:24px 0 0;border-top:2px dashed var(--line)}
dt,dd{padding:11px 0;border-bottom:2px dashed var(--line);margin:0}
dt{color:var(--text-secondary);font-size:14px;font-weight:600}dd{font-weight:600}
.dlg h3{font-size:19px;margin:28px 0 12px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:130px minmax(0,1fr);padding:9px 0;border-bottom:2px dashed var(--line)}
.tl span:first-child{color:var(--text-primary);font-weight:800;font-size:14.5px;font-family:var(--heading)}
.cta{display:inline-block;margin-top:24px;background:var(--accent-primary);color:var(--accent-ink);padding:11px 22px;border-radius:var(--r-sm);font-weight:700;text-decoration:none}
.cta.cs{background:var(--bg-surface);color:var(--text-primary);margin-left:8px}
.lg{margin-top:14px}.lg p{margin:0 0 10px}
.pp{display:block;max-width:100%;max-height:440px;margin:0 auto 22px;border:2px solid var(--border-color);border-radius:var(--r-sm);object-fit:contain}
.sb{background:var(--bg-surface);color:var(--text-primary);padding:6px 12px;border-radius:10px;font-size:13.5px;font-weight:700}
.sb.dg{background:var(--urgent);color:#18181B}

/* form admin */
.fm{display:flex;flex-direction:column;gap:16px}
.fm label,.lb{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}
.fm small{font-weight:500;color:var(--text-secondary)}
.fi{width:100%;background:var(--bg-page);font-size:15px}
textarea.fi{resize:vertical}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rg{display:flex;gap:10px}
.rg label{flex-direction:row;align-items:center;gap:8px;border:2px solid var(--border-color);padding:9px 14px;border-radius:var(--r-sm);flex:1;cursor:pointer;background:var(--bg-page)}
.fm label.ck{flex-direction:row;align-items:center;gap:10px}
.pbx{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pp2,.np{width:120px;max-width:100%;aspect-ratio:3/4;border-radius:var(--r-sm)}
.pp2{object-fit:cover;border:2px solid var(--border-color);display:block}
.np{border:2px dashed var(--border-color);display:grid;place-items:center;text-align:center;font-size:12.5px;color:var(--text-secondary);font-weight:500}
.pc{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.tr{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr) auto;gap:8px;margin-bottom:8px}
.er{color:var(--warn);font-weight:700;font-size:14px;min-height:1.2em;margin:0}
.fa{display:flex;gap:10px;justify-content:flex-end}
.pb2{background:var(--accent-primary);color:var(--accent-ink);padding:10px 20px;border-radius:var(--r-sm);font-weight:700}
.pb2[disabled]{opacity:.6}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,460px);background:var(--text-primary);color:var(--bg-page);border:2px solid var(--border-color);box-shadow:4px 4px 0 var(--shadow-color);padding:12px 16px;border-radius:var(--r-sm);font-size:14.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* kontak */
.cth{text-align:center;padding:clamp(56px,10vw,104px) 0 clamp(32px,5vw,56px)}
.cth h1{font-size:clamp(34px,6vw,60px);letter-spacing:-.03em;max-width:18ch;margin:0 auto}
.cth p{color:var(--text-secondary);font-size:clamp(16px,2vw,20px);max-width:44ch;margin:18px auto 0}
.ct{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));padding:8px 0 56px}
.ct a{display:block;background:var(--c,#BAE6FD);color:#18181B;border:2px solid var(--border-color);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow-color);padding:22px;text-decoration:none;transition:all .15s ease}
.ct a:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow-color)}
.ct a:nth-child(1){--c:#BBF7D0}.ct a:nth-child(2){--c:#FBCFE8}.ct a:nth-child(3){--c:#BAE6FD}
.ct small{display:block;font-size:13px;font-weight:700;margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.ct b{font:800 18px var(--heading);word-break:break-word}

/* responsif */
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);gap:28px}.radar{max-width:280px}}
@media (max-width:620px){
.r2{grid-template-columns:minmax(0,1fr)}
.tr{grid-template-columns:minmax(0,1fr) auto}.tr input:nth-child(2){grid-column:1;grid-row:2}
dl,.tl li{grid-template-columns:1fr}dt{border:0;padding-bottom:0}.tl li{gap:2px}
.intro{padding:32px 20px}
.cta.cs{margin-left:0;margin-top:12px}
}
@media (max-width:600px){
.bar{flex-wrap:wrap;gap:0 12px;padding-top:10px;padding-bottom:10px}
.logo{order:1}
.acts{order:2;padding-left:0;border:0}
nav{order:3;width:100%;margin-top:10px;gap:6px}
nav a{flex:1;text-align:center;padding:8px 4px}
.abi span{display:none}.abi{justify-content:flex-end}
}
/* === aksen hijau: biru = primary, hijau = secondary, putih/hitam = tertiary === */
.logo em{color:var(--accent-secondary)}
.lm circle:last-child{fill:var(--accent-secondary)}
header{box-shadow:0 3px 0 var(--accent-secondary)}
nav a:hover{background:var(--green-soft);border-color:var(--border-color)}
.intro{background:linear-gradient(135deg,var(--bg-hero) 0%,var(--bg-hero) 50%,var(--green-soft) 100%)}
.intro h1{text-shadow:none}
.r-wedge{fill:var(--accent-secondary);opacity:.3}
.r-lead{stroke:var(--accent-secondary)}
.facts span:nth-child(1) b{color:var(--accent-primary)}
.facts span:nth-child(2) b{color:var(--green-ink)}
.facts span:nth-child(3) b{color:var(--text-primary)}
.facts span:nth-child(2){background:var(--green-soft)}
.sh h2{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent-secondary) 55%,transparent) 62%);padding:0 4px;display:inline-block}
.sh a:hover,.sh button:hover,.sb:hover,.cta.cs:hover{background:var(--green-soft)}
.abar .sb:hover{background:var(--accent-secondary);color:#0F172A}
.kicker{color:var(--green-ink)}
.b-hot{background:var(--accent-secondary);color:#0F172A;border-color:#0F172A}
.row:hover{border-color:var(--accent-secondary)}
.seg button:hover:not(.on){background:var(--green-soft)}
.cta{background:var(--accent-primary)}
.btn:hover,.pb2:hover{background:var(--accent-secondary);color:#0F172A}
.cf .fee{color:var(--green-ink)}
.fi:focus,.filters input:focus,.filters select:focus{outline:3px solid var(--accent-secondary);outline-offset:2px}
footer{box-shadow:inset 0 5px 0 var(--accent-secondary)}
.ct a:nth-child(1){--c:#6EE7B7}.ct a:nth-child(2){--c:#93C5FD}.ct a:nth-child(3){--c:#FFFFFF}
:root[data-theme="dark"] .ct a:nth-child(3){--c:#E2E8F0}

/* Kompres poster: lebar maks 600px, JPEG 0.65 -> Data URL (base64) yang disimpan langsung di objek lomba */
function shrink(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);
im.onload=function(){
function enc(maxW,q){var k=Math.min(1,maxW/im.width),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
var url=enc(600,.65);
if(url.length>350000)url=enc(480,.5);
URL.revokeObjectURL(u);
if(url.length>700000){rej(new Error('too_big'));return}
res({url:url})};
im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('bad_image'))};im.src=u})}

var FB=false,db=null,auth=null,SIG=null,seedTried=false;
function cfgOk(){var c=firebaseConfig;return typeof firebase!=='undefined'&&!!c&&!!c.apiKey&&!!c.databaseURL&&String(c.apiKey).indexOf('ISI_')!==0&&String(c.databaseURL).indexOf('ISI_')<0}
function arr(x){return Array.isArray(x)?x:(x&&typeof x==='object'?Object.keys(x).map(function(k){return x[k]}):[])}

function norm(v){
return arr(v).filter(function(i){return i&&typeof i==='object'&&i.id!=null}).map(function(i){

return i})}

/* Isi data awal (DEFAULT) hanya sekali, aman dari balapan antar-pengunjung lewat transaction */
function ensureSeed(force){
if(!FB||(seedTried&&!force))return;seedTried=true;
db.ref('meta/seeded').transaction(function(c){return c?undefined:true},function(err,ok){
if(err||!ok){if(err)console.warn('Seed dilewati:',err.code||err.message);return}
var o={};DEFAULT.forEach(function(i){o[i.id]=i});
db.ref('lomba').transaction(function(cur){return cur===null?o:undefined}).catch(function(x){console.warn('Seed gagal:',x);db.ref('meta/seeded').remove().catch(function(){})})},false)}
function startFB(){
firebase.initializeApp(firebaseConfig);db=firebase.database();
if(ADMIN_EMAIL){auth=firebase.auth();try{auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(function(){})}catch(x){}}
var got=false;
setTimeout(function(){if(!got){S.loading=false;S.err='Belum bisa terhubung ke database. Periksa koneksi internet.';refresh()}},10000);
db.ref('lomba').on('value',function(snap){got=true;var list=norm(snap.val());
if(list.length){applyData(list);return}
db.ref('meta/seeded').once('value').then(function(s){
if(s.val()===true){applyData([])}
else{applyData(clone(DEFAULT));ensureSeed()}},
function(){applyData([])})},
function(err){got=true;S.loading=false;S.err='Gagal memuat data'+(err&&err.code==='PERMISSION_DENIED'?': akses baca ditolak oleh Security Rules.':'. Periksa koneksi dan konfigurasi Firebase.');refresh()})}

FB=cfgOk();

if(!FB){D=clone(DEFAULT);S.loading=false;refresh();toast('Firebase belum dikonfigurasi. Menampilkan data contoh; perubahan tidak tersimpan permanen.')}}
function failMsg(x){var c=x&&(x.code||x.message)||'';
if(/permission/i.test(c))return 'Gagal menyimpan: akses ditolak Security Rules. Pastikan Anda sudah login admin Firebase.';
if(/network|disconnect|unavailable/i.test(c))return 'Gagal menyimpan: koneksi terputus. Coba lagi.';
return 'Gagal menyimpan ke Firebase. Coba lagi beberapa saat.'}
function opSet(it){
if(!FB){D=D.filter(function(x){return x.id!==it.id});D.unshift(it);refresh();return Promise.resolve()}
return db.ref('lomba/'+it.id).set(it)}
function opRemove(ids){
if(!FB){D=D.filter(function(x){return ids.indexOf(x.id)<0});refresh();return Promise.resolve()}
var u={};ids.forEach(function(i){u[i]=null});return db.ref('lomba').update(u)}

return p.then(function(){done=true;clearTimeout(t);toast(FB?ok:ok+' (mode lokal, belum tersambung ke Firebase)')}).catch(function(x){done=true;clearTimeout(t);console.error(x);toast(failMsg(x))})}
