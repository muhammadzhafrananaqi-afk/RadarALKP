<script id="app-js">
(function(){
'use strict';
var LOMBA=['Futsal','Basket','Voli','Badminton','Sepak Bola','Robotik','Coding','Desain Grafis','Debat','Karya Tulis','Seni dan Musik'];
var OLI=['Matematika','Fisika','Kimia','Biologi','Informatika','Ekonomi','Geografi','Astronomi','Kebumian','Bahasa Inggris'];
var NOW=new Date();
var seed={items:[]};try{seed=JSON.parse(document.getElementById('app-data').textContent)}catch(e){}
var S={items:seed.items||[],route:'beranda',q:'',kind:'semua',cat:'Semua',sort:'deadline',admin:false,open:null,form:null,pw:false,confirm:''};
try{S.admin=!!sessionStorage.getItem('alkp_pw')}catch(e){}
function $(s,r){return(r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var X='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var SR='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>';
var LOGO='<span class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 12l6-6"/></svg></span>';
function parseD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],23,59,59)}
function fmtLong(d){return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
function fmtShort(d){return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})}
function status(it){
  if(!it.deadline)return{label:'Cek info resmi',cls:'',closed:false,days:null};
  var end=parseD(it.deadline);
  if(end<NOW)return{label:'Pendaftaran ditutup',cls:'p-c',closed:true,days:-1};
  var d=Math.ceil((end-NOW)/864e5);
  if(d<=7)return{label:'Tutup '+d+' hari lagi',cls:'p-u',closed:false,days:d};
  return{label:'Tutup '+fmtShort(end),cls:'',closed:false,days:d};
}
function kind(it){return it.type==='olimpiade'?'Olimpiade':'Lomba'}
function hue(s){var h=0;s=String(s||'');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return 140+(h%75)}
function poster(it){
  if(it.photo&&/^data:image\//.test(it.photo))return'<div class="poster"><img src="'+esc(it.photo)+'" alt="" loading="lazy"></div>';
  return'<div class="poster gen" style="--h:'+hue(it.field||it.title)+'"><span class="gen-k">'+kind(it)+'</span><span class="gen-f">'+esc(it.field)+'</span></div>';
}
function tile(it){if(!it.deadline)return'';var d=parseD(it.deadline);return'<span class="tile"><i>'+d.toLocaleDateString('id-ID',{month:'short'})+'</i><b>'+d.getDate()+'</b></span>'}
function byId(id){return S.items.filter(function(i){return i.id===id})[0]||null}
function fieldsOf(type,base){var l=base.slice();S.items.forEach(function(it){if(it.type===type&&l.indexOf(it.field)<0)l.push(it.field)});return l}
function count(type,f){return S.items.filter(function(it){return it.type===type&&(!f||it.field===f)}).length}
function cmp(a,b){
  if(S.sort==='baru')return(b.created||0)-(a.created||0);
  var sa=status(a),sb=status(b);
  if(sa.closed!==sb.closed)return sa.closed?1:-1;
  return(sa.days==null?9e9:sa.days)-(sb.days==null?9e9:sb.days);
}
function badges(it){return'<div class="bd">'+(it.hot?'<span class="b b-h">Populer</span>':'')+(it.example?'<span class="b b-x">Contoh</span>':'')+'</div>'}
function header(){
  var r=S.route;
  return'<header class="hdr"><div class="wrap hdr-in"><a class="brand" href="#beranda">'+LOGO+'<span>ALKP Radar</span></a>'+
  '<nav class="nav" aria-label="Utama"><a href="#beranda" class="'+(r==='beranda'?'on':'')+'">Beranda</a><a href="#cari" data-act="navcari" class="'+(r==='cari'?'on':'')+'">Cari lomba</a></nav>'+
  '<button class="btn btn-s '+(S.admin?'':'btn-g')+'" data-act="'+(S.admin?'logout':'admin')+'">'+(S.admin?'Keluar admin':'Admin')+'</button></div>'+
  (S.admin?'<div class="adminbar"><div class="wrap ab-in"><span class="ab-t">Mode admin aktif</span><button class="btn btn-s btn-p" data-act="add">Tambah lomba</button>'+
  (S.items.some(function(i){return i.example})?'<button class="btn btn-s" data-act="clearEx">'+(S.confirm==='clearEx'?'Yakin? Klik lagi':'Hapus data contoh')+'</button>':'')+'</div></div>':'')+'</header>';
}
function card(it){
  var st=status(it);
  return'<article class="card"><div class="pw">'+poster(it)+badges(it)+'</div><div class="cb"><div class="kick">'+kind(it)+', '+esc(it.field)+'</div>'+
  '<h3><button class="cl" data-act="open" data-id="'+esc(it.id)+'">'+esc(it.title)+'</button></h3><p class="short">'+esc(it.short)+'</p>'+
  '<div class="cf"><span class="pill '+st.cls+'">'+esc(st.label)+'</span><span class="fee">'+esc(it.fee||'Cek detail')+'</span></div></div>'+
  (S.admin?'<div class="cad"><button class="btn btn-s" data-act="edit" data-id="'+esc(it.id)+'">Edit</button><button class="btn btn-s btn-d" data-act="del" data-id="'+esc(it.id)+'">'+(S.confirm==='del:'+it.id?'Yakin hapus?':'Hapus')+'</button></div>':'')+'</article>';
}
function home(){
  var open=S.items.filter(function(i){return!status(i).closed});
  var soon=open.filter(function(i){var d=status(i).days;return d!=null&&d<=14}).sort(cmp);
  var hot=open.filter(function(i){return i.hot}).sort(cmp).slice(0,6);
  var f=soon[0]||open.slice().sort(cmp)[0];
  var h='<section class="hero"><div class="wrap hero-in"><div><h1>Temukan lomba dan olimpiade yang cocok untukmu</h1>'+
  '<p class="lead">Jadwal, biaya, dan batas pendaftaran dikumpulkan di satu tempat, jadi kamu tidak perlu membuka banyak situs satu per satu.</p>'+
  '<form class="sbox" id="heroSearch" role="search">'+'<input id="hq" type="search" placeholder="Cari nama lomba, kota, atau bidang" aria-label="Cari lomba">'+'<button class="btn btn-p" type="submit">Cari</button></form>'+
  '<div class="quick"><button class="chip" data-act="gocat" data-kind="lomba" data-cat="Semua">Semua lomba<i>'+count('lomba')+'</i></button><button class="chip" data-act="gocat" data-kind="olimpiade" data-cat="Semua">Semua olimpiade<i>'+count('olimpiade')+'</i></button></div>'+
  '<p class="meta">'+S.items.length+' lomba dan olimpiade terpantau, '+open.length+' masih buka pendaftaran.</p></div>'+
  (f?'<aside class="feat" aria-label="Paling dekat ditutup"><small>Paling dekat ditutup</small><div class="feat-r">'+tile(f)+'<button class="t" data-act="open" data-id="'+esc(f.id)+'">'+esc(f.title)+'</button></div><div class="kick">'+kind(f)+', '+esc(f.field)+'</div><div class="act"><span class="pill '+status(f).cls+'">'+esc(status(f).label)+'</span><span class="fee">'+esc(f.fee||'')+'</span></div></aside>':'')+'</div></section>';
  h+='<section class="sec"><div class="wrap"><div class="sec-h"><div><h2>Sedang populer</h2><p>Lomba yang banyak dilirik dan masih bisa didaftari.</p></div><a class="lk" href="#cari" data-act="navcari">Lihat semua</a></div>'+
  (hot.length?'<div class="grid">'+hot.map(card).join('')+'</div>':'<div class="empty"><b>Belum ada lomba populer</b>Admin dapat menandai lomba sebagai populer saat menambah atau mengedit.</div>')+'</div></section>';
  if(soon.length)h+='<section class="sec"><div class="wrap"><div class="sec-h"><div><h2>Segera ditutup</h2><p>Diurutkan dari batas pendaftaran terdekat.</p></div></div><ul class="soon">'+
    soon.slice(0,5).map(function(it){var st=status(it);return'<li><button data-act="open" data-id="'+esc(it.id)+'">'+tile(it)+'<span class="s-b"><span class="s-t">'+esc(it.title)+'</span><span class="s-m">'+kind(it)+', '+esc(it.field)+'</span></span><span class="pill '+st.cls+'">'+esc(st.label)+'</span></button></li>'}).join('')+'</ul></div></section>';
  function row(lbl,type,list){var l=list.filter(function(x){return count(type,x)});return'<div><h3>'+lbl+'</h3><ul>'+(l.length?l.map(function(x){return'<li><button class="ix" data-act="gocat" data-kind="'+type+'" data-cat="'+esc(x)+'"><span>'+esc(x)+'</span><em>'+count(type,x)+'</em></button></li>'}).join(''):'<li class="s-m" style="padding:11px 2px">Belum ada.</li>')+'</ul></div>'}
  h+='<section class="sec"><div class="wrap"><div class="sec-h"><div><h2>Jelajah per bidang</h2><p>Pilih bidang untuk langsung melihat lombanya.</p></div></div>'+
  '<div class="idx">'+row('Lomba','lomba',fieldsOf('lomba',LOMBA))+row('Olimpiade','olimpiade',fieldsOf('olimpiade',OLI))+'</div>'+
  (S.items.some(function(i){return i.example})?'<p class="note">Sebagian data di halaman ini masih contoh untuk memperlihatkan tampilan. Admin dapat menghapusnya lalu memasukkan data asli.</p>':'')+'</div></section>';
  return h;
}
function chipsRow(lbl,type,list){
  return'<div class="fg"><span class="fl">'+lbl+'</span><div class="chips"><button class="chip'+(S.kind===type&&S.cat==='Semua'?' on':'')+'" data-act="cat" data-kind="'+type+'" data-cat="Semua">Semua<i>'+count(type)+'</i></button>'+
  list.map(function(f){var n=count(type,f);return'<button class="chip'+(S.kind===type&&S.cat===f?' on':'')+(n?'':' zero')+'" data-act="cat" data-kind="'+type+'" data-cat="'+esc(f)+'">'+esc(f)+'<i>'+n+'</i></button>'}).join('')+'</div></div>';
}
function search(){
  return'<section class="wrap"><div class="ph"><h1>Cari lomba</h1><p>Saring berdasarkan bidang atau mata pelajaran olimpiade.</p></div>'+
  '<div class="tb"><div class="search">'+SR+'<input id="q" type="search" placeholder="Cari nama lomba, kota, atau penyelenggara" value="'+esc(S.q)+'" aria-label="Cari lomba"></div>'+
  '<select id="sort" class="field" aria-label="Urutkan"><option value="deadline"'+(S.sort==='deadline'?' selected':'')+'>Batas daftar terdekat</option><option value="baru"'+(S.sort==='baru'?' selected':'')+'>Terbaru ditambahkan</option></select></div>'+
  picker()+
  '<div id="results">'+resultsHtml()+'</div></section>';
}
function pickLabel(){return S.kind==='semua'?'Semua kategori':(S.cat==='Semua'?'Semua '+(S.kind==='olimpiade'?'olimpiade':'lomba'):S.cat)}
function opt(k,c,l,n){var on=S.kind===k&&S.cat===c;return'<button type="button" role="option" aria-selected="'+on+'" class="opt'+(on?' on':'')+'" data-act="cat" data-kind="'+k+'" data-cat="'+esc(c)+'" data-label="'+esc(l.toLowerCase())+'"><span>'+esc(l)+'</span><em>'+n+'</em></button>'}
function picker(){
  var g=function(t,l,base){return'<div class="pg"><div class="pgt">'+l+'</div>'+opt(t,'Semua','Semua '+l.toLowerCase(),count(t))+fieldsOf(t,base).map(function(f){return opt(t,f,f,count(t,f))}).join('')+'</div>'};
  return'<div class="pick"><button type="button" class="pick-b" data-act="pickt" aria-haspopup="listbox" aria-expanded="'+!!S.pickOpen+'"><span class="pk-l">Kategori</span><span class="pk-v">'+esc(pickLabel())+'</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>'+
  (S.pickOpen?'<div class="pick-p"><input id="pq" type="search" class="field" placeholder="Cari kategori, mis. Robotik" aria-label="Cari kategori" autocomplete="off"><div class="pk-list" id="pkList" role="listbox">'+opt('semua','Semua','Semua kategori',S.items.length)+g('lomba','Lomba',LOMBA)+g('olimpiade','Olimpiade',OLI)+'<p class="pk-none" hidden>Kategori tidak ditemukan.</p></div></div>':'')+'</div>';
}
function resultsHtml(){
  var q=S.q.trim().toLowerCase();
  var list=S.items.filter(function(it){
    if(S.kind!=='semua'&&it.type!==S.kind)return false;
    if(S.cat!=='Semua'&&it.field!==S.cat)return false;
    return!q||(it.title+' '+it.short+' '+it.field+' '+(it.organizer||'')+' '+(it.place||'')).toLowerCase().indexOf(q)>=0;
  }).sort(cmp);
  var h='<p class="rc" aria-live="polite">'+list.length+' hasil ditemukan</p>';
  if(!list.length)return h+'<div class="empty"><b>Belum ada yang cocok</b>Coba kata kunci lain atau ganti filter. <button class="lk" data-act="reset">Hapus semua filter</button></div>';
  return h+'<div class="grid">'+list.map(card).join('')+'</div>';
}
function footer(){return'<footer class="ftr"><div class="wrap ftr-in"><span><b>ALKP Radar</b>, tempat pelajar menemukan lomba tanpa mencari lama-lama.</span><span>Data diperbarui oleh admin</span></div></footer>'}
function detailHtml(it){
  var info=[['Tempat',it.place],['Pelaksanaan',it.date],['Batas daftar',it.deadline?fmtLong(parseD(it.deadline)):''],['Biaya daftar',it.fee],['Peserta',it.level],['Penyelenggara',it.organizer],['Hadiah',it.prize],['Kontak',it.contact]].filter(function(x){return x[1]});
  var st=status(it);
  var lp=String(it.long||'').split(/\n+/).filter(Boolean).map(function(p){return'<p>'+esc(p)+'</p>'}).join('');
  var link=/^https?:\/\//i.test(it.link||'')?'<a class="btn btn-p" href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">Daftar atau info resmi</a>':'';
  return'<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-label="'+esc(it.title)+'" tabindex="-1"><button class="x" data-act="closeOv" aria-label="Tutup">'+X+'</button>'+
  '<div class="dp"><div class="pw" style="padding:0">'+poster(it)+badges(it).replace('top:18px','')+'</div></div>'+
  '<div class="db"><div><div class="kick">'+kind(it)+', '+esc(it.field)+'</div><h2>'+esc(it.title)+'</h2></div><p class="dsh">'+esc(it.short)+'</p>'+
  '<div class="act"><span class="pill '+st.cls+'">'+esc(st.label)+'</span>'+link+'</div>'+
  (lp?'<div class="ds dl"><h3>Tentang lomba</h3>'+lp+'</div>':'')+
  (info.length?'<dl class="info">'+info.map(function(x){return'<div><dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join('')+'</dl>':'')+
  ((it.timeline&&it.timeline.length)?'<div class="ds"><h3>Jadwal</h3><ol class="tl">'+it.timeline.map(function(t){return'<li><span class="tl-d">'+esc(t.d)+'</span><span>'+esc(t.t)+'</span></li>'}).join('')+'</ol></div>':'')+
  (S.admin?'<div class="act"><button class="btn" data-act="edit" data-id="'+esc(it.id)+'">Edit</button><button class="btn btn-d" data-act="del" data-id="'+esc(it.id)+'">'+(S.confirm==='del:'+it.id?'Yakin hapus?':'Hapus')+'</button></div>':'')+'</div></div></div>';
}
function pwHtml(){
  return'<div class="ov"><div class="dlg sm" role="dialog" aria-modal="true" aria-label="Masuk admin" tabindex="-1"><button class="x" data-act="closeOv" aria-label="Tutup">'+X+'</button>'+
  '<form class="fm" id="pwForm"><h2>Masuk admin</h2><p style="margin:0;color:var(--mut)">Masukkan password untuk menambah, mengubah, atau menghapus data lomba.</p>'+
  '<label for="pw">Password<input class="field" id="pw" type="password" autocomplete="current-password" required></label><p class="err" id="pwErr"></p>'+
  '<div class="fma"><button type="button" class="btn" data-act="closeOv">Batal</button><button class="btn btn-p" type="submit">Masuk</button></div></form></div></div>';
}
function fieldOptions(type,val){
  var list=type==='olimpiade'?OLI:LOMBA,custom=val&&list.indexOf(val)<0;
  return list.map(function(f){return'<option'+(f===val?' selected':'')+'>'+esc(f)+'</option>'}).join('')+'<option value="__custom"'+(custom?' selected':'')+'>Lainnya (ketik sendiri)</option>';
}
function tlRow(d,t){return'<div class="tlr"><input class="field" placeholder="Tanggal, mis. 12 Des" value="'+esc(d)+'" aria-label="Tanggal"><input class="field" placeholder="Kegiatan" value="'+esc(t)+'" aria-label="Kegiatan"><button type="button" class="btn btn-s" data-act="delrow" aria-label="Hapus baris">'+X+'</button></div>'}
function noPhoto(f){return'<div class="poster gen" style="--h:'+hue(f||'x')+'"><span class="gen-k">Otomatis</span><span class="gen-f">Tanpa foto</span></div>'}

function formHtml(){
  var it=S.form.item,type=it.type||'lomba',list=type==='olimpiade'?OLI:LOMBA,custom=it.field&&list.indexOf(it.field)<0;
  var tl=(it.timeline&&it.timeline.length?it.timeline:[{d:'',t:''}]).map(function(t){return tlRow(t.d,t.t)}).join('');
  return'<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-label="Form lomba" tabindex="-1"><button class="x" data-act="closeOv" aria-label="Tutup">'+X+'</button>'+
  '<form class="fm" id="itemForm" novalidate><h2>'+(S.form.isNew?'Tambah lomba':'Edit lomba')+'</h2>'+
  '<div class="lbl">Jenis<div class="seg"><label><input type="radio" name="type" value="lomba"'+(type==='lomba'?' checked':'')+'>Lomba</label><label><input type="radio" name="type" value="olimpiade"'+(type==='olimpiade'?' checked':'')+'>Olimpiade</label></div></div>'+
  '<div class="row2"><label for="f-field"><span id="f-fieldlbl">'+(type==='olimpiade'?'Mata pelajaran':'Bidang')+'</span><select class="field" id="f-field" name="field" style="width:100%">'+fieldOptions(type,it.field)+'</select></label>'+
  '<label for="f-custom" id="f-customwrap"'+(custom?'':' hidden')+'>Nama bidang<input class="field" id="f-custom" name="fieldCustom" value="'+esc(custom?it.field:'')+'" placeholder="Mis. Panahan"></label></div>'+
  inp('title','Judul lomba',it.title,'required')+
  '<label for="f-short">Deskripsi singkat <small>Tampil di kartu, maksimal 160 karakter</small><textarea class="field" id="f-short" name="short" maxlength="160" style="min-height:74px">'+esc(it.short)+'</textarea></label>'+
  '<label for="f-long">Deskripsi lengkap <small>Pisahkan paragraf dengan baris baru</small><textarea class="field" id="f-long" name="long">'+esc(it.long)+'</textarea></label>'+
  '<div class="lbl">Foto atau poster<div class="pb"><div id="photoPrev">'+(it.photo?poster(it):noPhoto(it.field))+'</div><div style="display:flex;flex-direction:column;gap:8px"><input type="file" id="f-photo" accept="image/*" aria-label="Pilih foto"><button type="button" class="btn btn-s" data-act="clearPhoto">Hapus foto</button></div></div></div>'+
  '<div class="row2">'+inp('place','Tempat',it.place)+inp('date','Tanggal pelaksanaan',it.date,'placeholder="Mis. 12 sampai 14 Desember 2026"')+'</div>'+
  '<div class="row2">'+inp('deadline','Batas pendaftaran',it.deadline,'type="date"')+inp('fee','Biaya pendaftaran',it.fee,'placeholder="Mis. Rp 150.000 atau Gratis"')+'</div>'+
  '<div class="row2">'+inp('level','Tingkat peserta',it.level,'placeholder="Mis. SMA/SMK sederajat"')+inp('organizer','Penyelenggara',it.organizer)+'</div>'+
  '<div class="row2">'+inp('prize','Hadiah',it.prize)+inp('contact','Kontak panitia',it.contact)+'</div>'+
  inp('link','Link pendaftaran atau info resmi',it.link,'placeholder="https://"')+
  '<div class="lbl">Jadwal<div id="tlRows">'+tl+'</div><div><button type="button" class="btn btn-s" data-act="addrow">Tambah baris</button></div></div>'+
  '<label class="chk" for="f-hot"><input type="checkbox" id="f-hot" name="hot"'+(it.hot?' checked':'')+'>Tandai sebagai populer (tampil di beranda)</label>'+
  '<p class="err" id="formErr" role="alert"></p><div class="fma"><button type="button" class="btn" data-act="closeOv">Batal</button><button class="btn btn-p" type="submit">Simpan</button></div></form></div></div>';
}
function renderOverlay(){
  var o=$('#overlay'),h='';
  if(S.pw)h=pwHtml();else if(S.form)h=formHtml();else if(S.open){var it=byId(S.open);if(it)h=detailHtml(it);else S.open=null}
  o.innerHTML=h;document.documentElement.classList.toggle('lock',!!h);
  if(h){var d=o.querySelector('.dlg');(o.querySelector('#pw')||d).focus()}
}
function renderMain(){$('#hdr').innerHTML=header();$('#view').innerHTML=S.route==='cari'?search():home()}
function render(){renderMain();renderOverlay()}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},5000)}
function pw(){try{return sessionStorage.getItem('alkp_pw')||''}catch(e){return''}}
async function persist(msg){
  try{
    var r=await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':pw()},body:JSON.stringify({items:S.items})});
    if(r.status===401){S.admin=false;try{sessionStorage.removeItem('alkp_pw')}catch(x){}render();toast('Sesi admin tidak valid. Masuk lagi.');return false}
    if(r.status===413)throw 0;
    if(!r.ok)throw 0;
    toast(msg);return true;
  }catch(e){toast('Gagal menyimpan. Periksa koneksi, atau kecilkan ukuran foto, lalu coba lagi.');return false}
}
function load(){
  fetch('/api/items',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(j&&Array.isArray(j.items)&&!S.open&&!S.form&&!S.pw){S.items=j.items;render()}
  }).catch(function(){});
}
function readPhoto(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var s=Math.min(1,800/im.width),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.65));
    };im.onerror=rej;im.src=r.result};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
function blank(){return{id:'',type:'lomba',field:'Futsal',title:'',short:'',long:'',place:'',date:'',deadline:'',fee:'',level:'',organizer:'',prize:'',contact:'',link:'',timeline:[{d:'',t:''}],hot:false,photo:''}}
function closeOv(){S.open=null;S.form=null;S.pw=false;S.confirm='';renderOverlay()}
function setRoute(){S.pickOpen=false;S.route=location.hash==='#cari'?'cari':'beranda'}
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('ov')){closeOv();return}
  if(S.pickOpen&&!e.target.closest('.pick')){S.pickOpen=false;var pp=$('.pick-p');if(pp)pp.remove()}
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act==='open'){S.open=id;S.confirm='';renderOverlay()}
  else if(act==='closeOv')closeOv();
  else if(act==='admin'){S.pw=true;renderOverlay()}
  else if(act==='logout'){S.admin=false;try{sessionStorage.removeItem('alkp_pw')}catch(x){}render();toast('Keluar dari mode admin.')}
  else if(act==='gocat'){S.kind=el.getAttribute('data-kind');S.cat=el.getAttribute('data-cat');S.q='';if(location.hash==='#cari')render();else location.hash='#cari'}
  else if(act==='navcari'){S.kind='semua';S.cat='Semua';S.q='';if(location.hash==='#cari')render()}
  else if(act==='cat'){S.kind=el.getAttribute('data-kind');S.cat=el.getAttribute('data-cat');S.pickOpen=false;renderMain()}
  else if(act==='pickt'){S.pickOpen=!S.pickOpen;renderMain();var pq=$('#pq');if(pq)pq.focus()}
  else if(act==='reset'){S.kind='semua';S.cat='Semua';S.q='';renderMain()}
  else if(act==='add'){S.form={item:blank(),isNew:true,photo:''};renderOverlay()}
  else if(act==='edit'){var it=byId(id);if(it){var c=JSON.parse(JSON.stringify(it));S.open=null;S.form={item:c,isNew:false,photo:c.photo||''};renderOverlay()}}
  else if(act==='del'){
    if(S.confirm!=='del:'+id){S.confirm='del:'+id;renderMain();if(S.open)renderOverlay();return}
    S.items=S.items.filter(function(i){return i.id!==id});S.confirm='';S.open=null;render();persist('Lomba dihapus.');
  }
  else if(act==='clearEx'){
    if(S.confirm!=='clearEx'){S.confirm='clearEx';renderMain();return}
    S.items=S.items.filter(function(i){return!i.example});S.confirm='';render();persist('Data contoh dihapus.');
  }
  else if(act==='addrow')$('#tlRows').insertAdjacentHTML('beforeend',tlRow('',''));
  else if(act==='delrow'){var r=el.closest('.tlr');if(r)r.remove()}
  else if(act==='clearPhoto'&&S.form){S.form.photo='';var fi=$('#f-photo');if(fi)fi.value='';$('#photoPrev').innerHTML=noPhoto(S.form.item.field)}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;var r=$('#results');if(r)r.innerHTML=resultsHtml()}
  else if(e.target.id==='pq'){var v=e.target.value.trim().toLowerCase(),n=0;document.querySelectorAll('#pkList .opt').forEach(function(b){var m=!v||b.getAttribute('data-label').indexOf(v)>=0;b.hidden=!m;if(m)n++});document.querySelectorAll('#pkList .pg').forEach(function(g){g.hidden=!g.querySelector('.opt:not([hidden])')});var no=$('#pkList .pk-none');if(no)no.hidden=n>0}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sort'){S.sort=t.value;renderMain()}
  else if(t.name==='type'&&S.form){$('#f-field').innerHTML=fieldOptions(t.value,'');$('#f-fieldlbl').textContent=t.value==='olimpiade'?'Mata pelajaran':'Bidang';$('#f-customwrap').hidden=true}
  else if(t.id==='f-field')$('#f-customwrap').hidden=t.value!=='__custom';
  else if(t.id==='f-photo'&&t.files&&t.files[0])readPhoto(t.files[0]).then(function(u){S.form.photo=u;$('#photoPrev').innerHTML='<div class="poster"><img src="'+u+'" alt=""></div>'}).catch(function(){$('#formErr').textContent='Foto tidak bisa dibaca. Coba file gambar lain.'});
});
document.addEventListener('submit',async function(e){
  var f=e.target;
  if(f.id==='heroSearch'){e.preventDefault();S.q=$('#hq').value;S.kind='semua';S.cat='Semua';if(location.hash==='#cari')render();else location.hash='#cari'}
  else if(f.id==='pwForm'){
    e.preventDefault();var err=$('#pwErr'),p=$('#pw').value;err.textContent='';
    try{
      var r=await fetch('/api/items',{method:'PUT',headers:{'x-admin-password':p}});
      if(r.ok){S.admin=true;S.pw=false;try{sessionStorage.setItem('alkp_pw',p)}catch(x){}render();toast('Mode admin aktif.')}
      else if(r.status===401)err.textContent='Password salah. Coba lagi.';
      else err.textContent='Server belum siap. Pastikan ADMIN_PASSWORD sudah diatur di Vercel.';
    }catch(x){err.textContent='Tidak bisa terhubung ke server. Coba lagi.'}
  }
  else if(f.id==='itemForm'){
    e.preventDefault();
    var fd=new FormData(f),sel=fd.get('field'),er=$('#formErr');
    var field=sel==='__custom'?String(fd.get('fieldCustom')||'').trim():sel;
    var g=function(k){return String(fd.get(k)||'').trim()};
    if(!g('title')){er.textContent='Judul lomba wajib diisi.';return}
    if(!field){er.textContent='Pilih atau ketik bidang lomba.';return}
    if(!g('short')){er.textContent='Deskripsi singkat wajib diisi.';return}
    var tl=[];f.querySelectorAll('.tlr').forEach(function(r){var i=r.querySelectorAll('input'),d=i[0].value.trim(),t=i[1].value.trim();if(d||t)tl.push({d:d,t:t})});
    var link=g('link');if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
    var old=S.form.item;
    var item={id:old.id||('i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),type:fd.get('type'),field:field,title:g('title'),short:g('short'),long:g('long'),place:g('place'),date:g('date'),deadline:g('deadline'),fee:g('fee'),level:g('level'),organizer:g('organizer'),prize:g('prize'),contact:g('contact'),link:link,timeline:tl,hot:fd.get('hot')==='on',photo:S.form.photo||'',created:old.created||Date.now()};
    var isNew=S.form.isNew;
    if(isNew)S.items.unshift(item);else S.items=S.items.map(function(i){return i.id===item.id?item:i});
    S.form=null;render();persist(isNew?'Lomba ditambahkan.':'Perubahan disimpan.');
  }
});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(S.open||S.form||S.pw)closeOv();else if(S.pickOpen){S.pickOpen=false;renderMain()}});
window.addEventListener('hashchange',function(){setRoute();S.confirm='';render();window.scrollTo(0,0)});
document.getElementById('root').innerHTML='<div id="hdr"></div><main id="view"></main>'+footer()+'<div id="overlay"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>';
setRoute();render();
load();
})();
</script>
</body></html>
